[project]
name = "attendance-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy>=2.3.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "selenium>=4.47.0",
    "webdriver-manager>=4.1.2",
]

[project.scripts]
attendance-scraper = "attendance_scraper:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
